name: Catalog maintenance

on:
  pull_request:
    branches: [main]
    paths:
      - "web/app/data/**"
      - "web/scripts/catalog-health.mjs"
      - "web/package.json"
      - ".github/workflows/catalog-maintenance.yml"
  push:
    branches: [main]
    paths:
      - "web/app/data/**"
      - "web/scripts/catalog-health.mjs"
      - "web/package.json"
  schedule:
    - cron: "47 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate catalog health report
        run: npm run catalog:health
      - name: Upload catalog health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-health
          path: web/catalog-health.json
          retention-days: 30
          if-no-files-found: error
