name: Release Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm release of the current main branch to production
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify requested SHA is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Detect deployable changes since last production release
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          last_release="$(git log -1 --grep='\[deploy\]' --format=%H || true)"
          if [ -z "$last_release" ]; then
            changed="$(git ls-tree -r --name-only HEAD)"
          else
            changed="$(git diff --name-only "$last_release"..HEAD)"
          fi
          deployable="$(printf '%s\n' "$changed" | grep -Ev '^(README(\.md)?$|CHANGELOG(\.md)?$|DEPLOYMENT_POLICY\.md$|DEPLOYMENT_STANDARD\.md$|docs/|\.github/)' || true)"
          if [ -z "$deployable" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            printf 'Deployable changes:\n%s\n' "$deployable"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.deployable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.deployable == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run production release checks
        if: steps.changes.outputs.deployable == 'true'
        working-directory: web
        run: npm run check

      - name: Re-verify main has not moved
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Prepare protected production release branch
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          branch="release/production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          cat > .github/production-release.json <<EOF
          {
            "sourceMainSha": "$source_sha",
            "requestedAt": "$requested_at",
            "workflowRun": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "managedBy": ".github/workflows/release-production.yml"
          }
          EOF

          git add .github/production-release.json
          git commit -m "release: production [deploy]"
          git push --set-upstream origin "$branch"

          pr_url="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          {
            echo "### Production release branch prepared"
            echo
            echo "- Source main: `$source_sha`"
            echo "- Release branch: `$branch`"
            echo "- Open the release pull request: $pr_url"
            echo
            echo "Use the title `release: production [deploy]`. Merge only after the required Core, browser, Dependency Audit, and CodeQL checks are green."
            echo "Netlify stays fail-closed: production runs only when the merged release history contains this marker commit and the release manifest change."
          } >> "$GITHUB_STEP_SUMMARY"
