name: Release Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm release of the current main branch to production
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify requested SHA is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Detect deployable changes since last production release
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          last_release="$(git log -1 --grep='\[deploy\]' --format=%H || true)"
          if [ -z "$last_release" ]; then
            changed="$(git ls-tree -r --name-only HEAD)"
          else
            changed="$(git diff --name-only "$last_release"..HEAD)"
          fi
          deployable="$(printf '%s\n' "$changed" | grep -Ev '^(README(\.md)?$|CHANGELOG(\.md)?$|DEPLOYMENT_POLICY\.md$|DEPLOYMENT_STANDARD\.md$|docs/|\.github/)' || true)"
          if [ -z "$deployable" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            printf 'Deployable changes:\n%s\n' "$deployable"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.deployable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.deployable == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run production release checks
        if: steps.changes.outputs.deployable == 'true'
        working-directory: web
        run: npm run check

      - name: Re-verify main has not moved
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Create protected release pull request
        if: steps.changes.outputs.deployable == 'true'
        id: release_pr
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          branch="release/production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          cat > .github/production-release.json <<EOF
          {
            "sourceMainSha": "$source_sha",
            "requestedAt": "$requested_at",
            "workflowRun": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "managedBy": ".github/workflows/release-production.yml"
          }
          EOF

          git add .github/production-release.json
          git commit -m "chore: prepare production release"
          git push --set-upstream origin "$branch"

          pr_url="$(gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$branch"             --title "release: production [deploy]"             --body "Controlled production release for source main \`$source_sha\`. This PR must pass the full release gate before its squash merge authorizes Netlify production.")"
          pr_number="${pr_url##*/}"

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for exact release gates
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          expected=(
            "Core verification"
            "Browser regression (desktop-chromium)"
            "Browser regression (tablet-chromium)"
            "Browser regression (mobile-chromium)"
            "Browser regression (desktop-firefox-smoke)"
            "Browser regression (desktop-webkit-smoke)"
            "Dependency audit"
            "CodeQL"
          )

          deadline=$((SECONDS + 2700))
          while [ "$SECONDS" -lt "$deadline" ]; do
            payload="$(gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100")"
            all_green=true

            for name in "${expected[@]}"; do
              row="$(jq -r --arg name "$name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | last
                | if . == null then "" else [.status, (.conclusion // "")] | @tsv end
              ' <<<"$payload")"

              if [ -z "$row" ]; then
                all_green=false
                continue
              fi

              status="${row%%$'\t'*}"
              conclusion="${row#*$'\t'}"

              if [ "$status" != "completed" ]; then
                all_green=false
                continue
              fi

              case "$conclusion" in
                success|neutral|skipped) ;;
                *)
                  echo "::error::Required release check failed: $name ($conclusion)"
                  exit 1
                  ;;
              esac
            done

            if [ "$all_green" = true ]; then
              echo "All required production release checks are green."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for production release checks."
          exit 1

      - name: Verify source main is still current
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release_pr.outputs.source_sha }}
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Release cancelled because main moved after this release was requested."
            echo "::error::main moved from $SOURCE_SHA to $current_main; rerun the release workflow."
            exit 1
          fi

      - name: Authorize exactly one production deployment through the release PR
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.release_pr.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER"             --repo "$GITHUB_REPOSITORY"             --squash             --delete-branch             --subject "release: production [deploy]"             --body "Controlled production release. Source main: $SOURCE_SHA"
