name: Refresh security lock

on:
  push:
    branches:
      - security/remediate-tooling-audit
    paths:
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    name: Refresh vulnerable transitive packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/remediate-tooling-audit
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh only the audited transitive packages
        working-directory: web
        run: npm update @babel/core browserslist js-yaml brace-expansion --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Ensure the package manifest did not change
        run: git diff --exit-code -- web/package.json
      - name: Install the refreshed locked graph
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the targeted dependency graph
        working-directory: web
        run: npm ls @babel/core browserslist js-yaml brace-expansion --all
      - name: Require a clean dependency audit
        working-directory: web
        run: npm audit --audit-level=low
      - name: Validate generated diff
        run: git diff --check -- web/package-lock.json
      - name: Commit the generated lockfile
        shell: bash
        run: |
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh vulnerable tooling dependency lock"
          git push origin HEAD:security/remediate-tooling-audit
