name: Production smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--neverwinterkeybind.netlify.app', github.event.pull_request.number) || 'https://neverwinterkeybind.netlify.app' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install production browser-test tooling
        run: npm install --no-save @playwright/test@1.55.0 axe-core@4.10.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployment target
        run: |
          echo "Waiting for $PRODUCTION_URL"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location "$PRODUCTION_URL" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment target did not become reachable in time."
          exit 1

      - name: Verify production HTTP and metadata contract
        run: node scripts/verify-production.mjs "$PRODUCTION_URL"

      - name: Run deployment release-proof suite
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-evidence-${{ github.run_number }}
          path: |
            production-smoke-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
