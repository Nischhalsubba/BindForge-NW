name: Maintenance summary

on:
  schedule:
    - cron: "11 1 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run dependency audit
        run: npm run security:audit
      - name: Generate catalog health report
        run: npm run catalog:health
      - name: Verify production contract
        run: node scripts/verify-production.mjs
        env:
          PRODUCTION_URL: https://neverwinterkeybind.netlify.app
      - name: Write maintenance summary
        if: always()
        run: |
          mkdir -p maintenance-report
          {
            echo "# BindForge NW maintenance summary"
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Production: https://neverwinterkeybind.netlify.app"
          } > maintenance-report/summary.md
          cp catalog-health.json maintenance-report/catalog-health.json 2>/dev/null || true
      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-summary
          path: maintenance-report/
          retention-days: 30
          if-no-files-found: error
