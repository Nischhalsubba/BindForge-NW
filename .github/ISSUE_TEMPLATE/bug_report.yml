name: Bug report
description: Report a reproducible product, layout, accessibility, or command-generation defect
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, game credentials, or private messages.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 150, Windows 11, 1440x900
    validations:
      required: true
  - type: input
    id: preset
    attributes:
      label: Affected preset or command
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
