[build]
  base = "web"
  command = "npm run build"
  ignore = "if [ \"\${CONTEXT:-}\" != \"production\" ] || [ \"\${PULL_REQUEST:-}\" != \"false\" ] || [ \"\${BRANCH:-}\" != \"main\" ]; then exit 0; fi; is_release_ref() { ref=\"$1\"; subject=\"$(git log -1 --pretty=%s \"$ref\" 2>/dev/null)\" || return 1; case \"$subject\" in *\"[deploy]\") ;; *) return 1 ;; esac; git diff-tree --no-commit-id --name-only -r \"$ref\" 2>/dev/null | grep -Fxq '.github/production-release.json'; }; ref=\"\${COMMIT_REF:-}\"; if is_release_ref \"$ref\"; then exit 1; fi; second=\"$(git rev-parse \"$ref^2\" 2>/dev/null || true)\"; if [ -n \"$second\" ] && is_release_ref \"$second\"; then exit 1; fi; exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
