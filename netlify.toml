[build]
  base = "web"
  command = "npm run build"
  ignore = "if [ \"$PULL_REQUEST\" = \"true\" ] || [ \"$BRANCH\" != \"main\" ]; then exit 0; fi; subject=\"$(git log -1 --pretty=%s \"$COMMIT_REF\")\"; case \"$subject\" in *\"[deploy]\") exit 1 ;; *) exit 0 ;; esac"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
