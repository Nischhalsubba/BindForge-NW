[build]
  base = "web"
  command = "npm run build"
  ignore = "if [ \"${CONTEXT:-}\" != \"production\" ] || [ \"${PULL_REQUEST:-}\" != \"false\" ] || [ \"${BRANCH:-}\" != \"main\" ]; then exit 0; fi; subject=\"$(git log -1 --pretty=%s \"${COMMIT_REF:-}\" 2>/dev/null)\" || exit 0; case \"$subject\" in *\"[deploy]\") exit 1 ;; *) exit 0 ;; esac"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
